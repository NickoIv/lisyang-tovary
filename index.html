<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ли Сян — товары</title>
<style>
  :root{
    --bg:#f2f2f7;
    --card:#ffffff;
    --text:#1c1c1e;
    --sub:#8e8e93;
    --blue:#007aff;
    --green:#34c759;
    --red:#ff3b30;
    --orange:#ff9500;
    --sep:#e5e5ea;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(242,242,247,0.85);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
    border-bottom:0.5px solid var(--sep);
  }
  h1{font-size:22px;font-weight:700;margin:0 0 2px;letter-spacing:-0.02em;}
  .subtitle{font-size:13px;color:var(--sub);margin:0; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .saved-badge{font-size:11px; color:var(--green); font-weight:600; opacity:0; transition:opacity .3s ease; white-space:nowrap;}
  .saved-badge.show{opacity:1;}

  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:14px 16px 4px;
  }
  .stat{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px;
  }
  .stat .label{font-size:12px;color:var(--sub);font-weight:500;}
  .stat .value{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-0.02em;}
  .stat .value.green{color:var(--green);}
  .stat .value.blue{color:var(--blue);}

  .toolbar{
    display:flex; gap:8px; padding:14px 16px 6px; align-items:center;
  }
  .search{
    flex:1;
    background:var(--card);
    border:none;
    border-radius:12px;
    padding:10px 12px;
    font-size:15px;
    color:var(--text);
  }
  .search::placeholder{color:var(--sub);}
  .iconbtn{
    background:var(--card);
    border:none;
    border-radius:12px;
    width:40px;height:40px;
    font-size:18px;
    color:var(--blue);
  }

  .section-label{
    font-size:13px; color:var(--sub); text-transform:uppercase; letter-spacing:0.03em;
    padding:16px 16px 6px;
    font-weight:600;
  }

  .list{padding:0 16px; display:flex; flex-direction:column; gap:10px;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.04);
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px;
    gap:10px;
  }
  .card-head .name{
    font-size:16px; font-weight:600; line-height:1.25;
  }
  .card-head .variant{
    font-size:13px; color:var(--sub); margin-top:2px;
  }
  .card-head .chevron{
    color:var(--sub); font-size:14px; transition:transform .2s ease; flex:none;
  }
  .card.open .chevron{transform:rotate(90deg);}

  .card-quick{
    display:flex; gap:10px; padding:0 14px 14px; font-size:13px; color:var(--sub); flex-wrap:wrap;
  }
  .pill{
    background:var(--bg);
    border-radius:8px;
    padding:4px 8px;
    font-weight:600;
    color:var(--text);
  }
  .pill.profit{color:var(--green);}
  .pill.stock0{color:var(--red);}

  .card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    border-top:0.5px solid var(--sep);
  }
  .card.open .card-body{max-height:1200px;}

  .stock-panel{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px; gap:10px; background:var(--bg);
  }
  .stock-panel .remaining{
    font-size:26px; font-weight:700; letter-spacing:-0.02em;
  }
  .stock-panel .remaining.zero{color:var(--red);}
  .stock-panel .remaining-label{font-size:11px; color:var(--sub); font-weight:600; text-transform:uppercase;}
  .stepper{
    display:flex; align-items:center; gap:8px;
  }
  .stepbtn{
    width:36px; height:36px;
    border-radius:10px;
    border:none;
    background:var(--card);
    color:var(--blue);
    font-size:18px;
    font-weight:700;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .stepbtn:active{background:var(--sep);}
  .stepbtn.receive{color:var(--green);}
  .stepper .stepper-label{font-size:11px;color:var(--sub); text-align:center; font-weight:600;}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:14px;
  }
  .field{
    display:flex; flex-direction:column; gap:4px;
  }
  .field label{font-size:11px; color:var(--sub); font-weight:600; text-transform:uppercase; letter-spacing:0.02em;}
  .field input{
    border:1px solid var(--sep);
    background:var(--bg);
    border-radius:10px;
    padding:9px 10px;
    font-size:15px;
    color:var(--text);
    width:100%;
  }
  .field input:focus{outline:none; border-color:var(--blue); background:#fff;}
  .field.readonly input{color:var(--sub); background:#f7f7f9;}

  .divider-label{
    grid-column:1 / -1;
    font-size:11px; color:var(--sub); font-weight:700; text-transform:uppercase;
    margin-top:6px; letter-spacing:0.03em;
  }

  .summary-row{
    display:flex; justify-content:space-between;
    padding:10px 14px; font-size:14px;
    border-top:0.5px solid var(--sep);
  }
  .summary-row .l{color:var(--sub);}
  .summary-row .r{font-weight:700;}
  .summary-row .r.green{color:var(--green);}

  .footer-actions{
    display:flex; gap:8px; padding:18px 16px 8px; flex-wrap:wrap;
  }
  .btn{
    flex:1;
    min-width:90px;
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:14px;
    font-weight:600;
    text-align:center;
  }
  .btn.primary{background:var(--blue); color:#fff;}
  .btn.secondary{background:var(--card); color:var(--blue);}
  .btn.danger{background:var(--card); color:var(--red);}
  .footer-note{
    font-size:12px; color:var(--sub); text-align:center; padding:4px 24px 4px;
    line-height:1.5;
  }
  #fileInput{display:none;}
  .empty{
    text-align:center; color:var(--sub); font-size:14px; padding:40px 20px;
  }
</style>
</head>
<body>

<header>
  <h1>Ли Сян — товары</h1>
  <p class="subtitle"><span id="subtitle">14 товаров</span><span class="saved-badge" id="savedBadge">✓ сохранено</span></p>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input class="search" id="search" placeholder="Поиск по названию..." />
  <button class="iconbtn" id="addBtn" title="Добавить товар">＋</button>
</div>

<div class="section-label">Товары</div>
<div class="list" id="list"></div>

<div class="footer-actions">
  <button class="btn secondary" id="exportBtn">Экспорт</button>
  <button class="btn primary" id="importBtn">Импорт</button>
  <button class="btn danger" id="resetBtn">Сбросить</button>
</div>
<input type="file" id="fileInput" accept="application/json">
<p class="footer-note">Все изменения считаются и сохраняются автоматически в этом браузере на этом устройстве. Чтобы перенести данные на другой телефон/компьютер — «Экспорт» здесь, затем «Импорт» там.</p>

<script>
const STORAGE_KEY = 'lisyang_dashboard_v2';

const RAW_DATA = [
{id:1, code:'Код 1', name:'Полики в багажник', kaspi:'Защита багажника', variant:'', note:'проверить', price:40000, qty:3, costYuan:390, rate:70, weight:8200, tariff:1800, deliveryExtra:2000, packaging:100, received:3, sold:0},
{id:2, code:'Код 2', name:'Сетка в багажник', kaspi:'Сетка', variant:'', note:'', price:9900, qty:3, costYuan:78, rate:70, weight:1100, tariff:1800, deliveryExtra:1000, packaging:100, received:3, sold:0},
{id:3, code:'Код 3', name:'Силиконовые формы в холодильник 3 штуки в комплекте', kaspi:'Органайзер в холодильник', variant:'', note:'', price:11500, qty:2, costYuan:63, rate:70, weight:1500, tariff:1800, deliveryExtra:1000, packaging:100, received:2, sold:0},
{id:4, code:'Код 4', name:'Защита для холодильника внешняя', kaspi:'', variant:'черный', note:'', price:9000, qty:2, costYuan:70, rate:70, weight:900, tariff:1800, deliveryExtra:1000, packaging:100, received:2, sold:0},
{id:5, code:'Код 5', name:'Защита для холодильника внешняя', kaspi:'', variant:'оранжевый', note:'', price:9000, qty:2, costYuan:70, rate:70, weight:900, tariff:1800, deliveryExtra:1000, packaging:100, received:2, sold:0},
{id:6, code:'Код 6', name:'Пепельница', kaspi:'', variant:'пластик', note:'проверить', price:3000, qty:2, costYuan:19, rate:70, weight:300, tariff:1800, deliveryExtra:500, packaging:100, received:2, sold:0},
{id:7, code:'Код 7', name:'Накладки на педали 3 штуки в комплекте', kaspi:'', variant:'металл', note:'', price:15000, qty:2, costYuan:129, rate:70, weight:1500, tariff:1800, deliveryExtra:1000, packaging:100, received:2, sold:0},
{id:8, code:'Код 8', name:'Набор наппа для ухода за кожей', kaspi:'', variant:'', note:'проверить', price:7000, qty:2, costYuan:63, rate:70, weight:1100, tariff:1800, deliveryExtra:500, packaging:100, received:2, sold:0},
{id:9, code:'Код 9', name:'Визитница', kaspi:'', variant:'металл', note:'проверить', price:5000, qty:4, costYuan:47, rate:70, weight:400, tariff:1800, deliveryExtra:500, packaging:100, received:4, sold:0},
{id:10, code:'Код 10', name:'Колпачки на колесные гайки с наклейками Ли', kaspi:'', variant:'АВС пластик', note:'', price:5000, qty:3, costYuan:54, rate:70, weight:230, tariff:1800, deliveryExtra:500, packaging:100, received:3, sold:0},
{id:11, code:'Код 11', name:'Магнитные крышки в порт зарядки', kaspi:'', variant:'', note:'', price:5000, qty:3, costYuan:36, rate:70, weight:300, tariff:1800, deliveryExtra:500, packaging:100, received:3, sold:0},
{id:12, code:'Код 12', name:'Подлокотники на скотче', kaspi:'', variant:'черный', note:'', price:9900, qty:2, costYuan:96, rate:70, weight:850, tariff:1800, deliveryExtra:1000, packaging:100, received:2, sold:0},
{id:13, code:'Код 13', name:'Подлокотники на резинке', kaspi:'', variant:'оранжевый', note:'', price:15000, qty:2, costYuan:168, rate:70, weight:850, tariff:1800, deliveryExtra:1000, packaging:100, received:2, sold:0},
{id:14, code:'Код 14', name:'Силиконовые накладки на дверной замок 4 штуки в комплекте', kaspi:'', variant:'', note:'', price:8000, qty:3, costYuan:54, rate:70, weight:200, tariff:1800, deliveryExtra:1000, packaging:100, received:3, sold:0},
];

// --- storage (guarded: works when self-hosted, degrades quietly inside sandboxed previews) ---
function safeLoad(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed) && parsed.length) return parsed;
    }
  }catch(e){ /* storage unavailable in this environment — fall back to defaults */ }
  return JSON.parse(JSON.stringify(RAW_DATA));
}
let saveTimer = null;
function safeSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    const badge = document.getElementById('savedBadge');
    badge.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>badge.classList.remove('show'), 1200);
  }catch(e){ /* no persistent storage available here — data stays in memory only */ }
}

let data = safeLoad();
let openId = null;

const fmt = n => Math.round(n).toLocaleString('ru-RU');
const remaining = item => Math.max(0, (item.received||0) - (item.sold||0));

function calc(item){
  const p = item.qty > 0 ? Math.round(item.costYuan / item.qty) : 0;           // цена за ед, юань
  const r = Math.round(p * item.rate);                                        // закупочная цена за ед, тенге
  const u = Math.round((item.weight / 1000) * item.tariff);                   // стоимость доставки всего
  const v = item.qty > 0 ? Math.round(u / item.qty) : 0;                      // доставка за ед
  const y = Math.round(item.price * 0.12);                                    // комиссия 12%
  const z = Math.round(item.price * 0.01);                                    // платежи 1%
  const ab = Math.round(item.price * 0.04);                                   // налог 4%
  const n = r + v + item.deliveryExtra + item.packaging + y + z + ab;         // себестоимость
  const i = item.price - n;                                                   // прибыль, тенге
  const h = item.price > 0 ? Math.round((i / item.price) * 100) : 0;          // прибыль, %
  return {p, r, u, v, y, z, ab, n, i, h};
}

function renderStats(){
  const totalRemaining = data.reduce((s,x)=>s+remaining(x),0);
  const totalSold = data.reduce((s,x)=>s+(x.sold||0),0);
  let totalProfitPotential = 0, totalRevenueSold = 0;
  data.forEach(x=>{
    const c = calc(x);
    totalProfitPotential += c.i * remaining(x);
    totalRevenueSold += x.price * (x.sold||0);
  });
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">Остаток на складе</div><div class="value blue">${totalRemaining} шт</div></div>
    <div class="stat"><div class="label">Продано всего</div><div class="value">${totalSold} шт</div></div>
    <div class="stat"><div class="label">Потенциальная прибыль</div><div class="value green">${fmt(totalProfitPotential)} ₸</div></div>
    <div class="stat"><div class="label">Выручка от продаж</div><div class="value">${fmt(totalRevenueSold)} ₸</div></div>
  `;
  document.getElementById('subtitle').textContent = `${data.length} товаров · ${totalRemaining} шт в наличии`;
}

function fieldRow(label, key, item, readonly){
  const val = item[key];
  return `<div class="field ${readonly?'readonly':''}">
    <label>${label}</label>
    <input type="${readonly?'text':'number'}" inputmode="decimal" data-key="${key}" ${readonly?'readonly':''} value="${val}">
  </div>`;
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const listEl = document.getElementById('list');
  const filtered = data.filter(x => (x.name + ' ' + x.variant + ' ' + x.kaspi).toLowerCase().includes(q));
  if(!filtered.length){
    listEl.innerHTML = `<div class="empty">Ничего не найдено</div>`;
    return;
  }
  listEl.innerHTML = filtered.map(item=>{
    const c = calc(item);
    const rem = remaining(item);
    const isOpen = openId === item.id;
    return `
    <div class="card ${isOpen?'open':''}" data-id="${item.id}">
      <div class="card-head" data-toggle="${item.id}">
        <div>
          <div class="name">${item.name}${item.variant ? ' · ' + item.variant : ''}</div>
          <div class="variant">${item.code}${item.note ? ' · ' + item.note : ''}</div>
        </div>
        <div class="chevron">›</div>
      </div>
      <div class="card-quick">
        <span class="pill">${fmt(item.price)} ₸</span>
        <span class="pill profit">${c.h}% · ${fmt(c.i)} ₸/шт</span>
        <span class="pill ${rem===0?'stock0':''}">Остаток: ${rem}</span>
        <span class="pill">Продано: ${item.sold||0}</span>
      </div>
      <div class="card-body">
        <div class="stock-panel">
          <div>
            <div class="remaining-label">Остаток на складе</div>
            <div class="remaining ${rem===0?'zero':''}">${rem} шт</div>
          </div>
          <div style="display:flex; gap:14px;">
            <div class="stepper">
              <div class="stepper-label">Продажа</div>
              <div style="display:flex; gap:6px;">
                <button class="stepbtn" data-act="sale-minus">−</button>
                <button class="stepbtn" data-act="sale-plus">+</button>
              </div>
            </div>
            <div class="stepper">
              <div class="stepper-label">Приход</div>
              <div style="display:flex; gap:6px;">
                <button class="stepbtn receive" data-act="receive-plus">+</button>
              </div>
            </div>
          </div>
        </div>
        <div class="grid">
          <div class="divider-label">Склад</div>
          ${fieldRow('Приход всего, шт','received',item,false)}
          ${fieldRow('Продано всего, шт','sold',item,false)}

          <div class="divider-label">Продажа</div>
          ${fieldRow('Цена продажи, ₸','price',item,false)}
          ${fieldRow('Количество в закупке','qty',item,false)}

          <div class="divider-label">Закупка</div>
          ${fieldRow('Стоимость закупки, ¥','costYuan',item,false)}
          ${fieldRow('Курс ¥→₸','rate',item,false)}
          <div class="field readonly"><label>Цена за ед., ¥</label><input readonly value="${c.p}"></div>
          <div class="field readonly"><label>Цена за ед., ₸</label><input readonly value="${fmt(c.r)}"></div>

          <div class="divider-label">Доставка</div>
          ${fieldRow('Общий вес, г','weight',item,false)}
          ${fieldRow('Тариф доставки','tariff',item,false)}
          <div class="field readonly"><label>Доставка всего, ₸</label><input readonly value="${fmt(c.u)}"></div>
          <div class="field readonly"><label>Доставка за ед., ₸</label><input readonly value="${fmt(c.v)}"></div>
          ${fieldRow('Доп. доставка, ₸','deliveryExtra',item,false)}
          ${fieldRow('Упаковка, ₸','packaging',item,false)}

          <div class="divider-label">Расчёт</div>
          <div class="field readonly"><label>Комиссия Каспи 12%</label><input readonly value="${fmt(c.y)}"></div>
          <div class="field readonly"><label>Платежи 1%</label><input readonly value="${fmt(c.z)}"></div>
          <div class="field readonly"><label>Налог 4%</label><input readonly value="${fmt(c.ab)}"></div>
        </div>
        <div class="summary-row"><span class="l">Себестоимость</span><span class="r">${fmt(c.n)} ₸</span></div>
        <div class="summary-row"><span class="l">Прибыль с единицы</span><span class="r green">${fmt(c.i)} ₸ (${c.h}%)</span></div>
        <div class="summary-row"><span class="l">Выручка от продаж</span><span class="r">${fmt(item.price*(item.sold||0))} ₸</span></div>
      </div>
    </div>`;
  }).join('');
}

function render(){
  renderStats();
  renderList();
}

function refreshCard(card, item){
  const c = calc(item);
  const rem = remaining(item);

  const quick = card.querySelector('.card-quick');
  quick.innerHTML = `
    <span class="pill">${fmt(item.price)} ₸</span>
    <span class="pill profit">${c.h}% · ${fmt(c.i)} ₸/шт</span>
    <span class="pill ${rem===0?'stock0':''}">Остаток: ${rem}</span>
    <span class="pill">Продано: ${item.sold||0}</span>
  `;

  const remEl = card.querySelector('.remaining');
  if(remEl){ remEl.textContent = rem + ' шт'; remEl.classList.toggle('zero', rem===0); }

  const receivedInput = card.querySelector('input[data-key="received"]');
  if(receivedInput && document.activeElement !== receivedInput) receivedInput.value = item.received;
  const soldInput = card.querySelector('input[data-key="sold"]');
  if(soldInput && document.activeElement !== soldInput) soldInput.value = item.sold;

  const readonlyInputs = card.querySelectorAll('.field.readonly input');
  const vals = [c.p, fmt(c.r), fmt(c.u), fmt(c.v), fmt(c.y), fmt(c.z), fmt(c.ab)];
  readonlyInputs.forEach((el,idx)=>{ if(vals[idx]!==undefined) el.value = vals[idx]; });

  const summaryVals = card.querySelectorAll('.summary-row .r');
  summaryVals[0].textContent = fmt(c.n) + ' ₸';
  summaryVals[1].textContent = fmt(c.i) + ' ₸ (' + c.h + '%)';
  summaryVals[2].textContent = fmt(item.price*(item.sold||0)) + ' ₸';
}

document.getElementById('list').addEventListener('click', (e)=>{
  const head = e.target.closest('[data-toggle]');
  if(head){
    const id = Number(head.dataset.toggle);
    openId = openId === id ? null : id;
    renderList();
    return;
  }
  const actBtn = e.target.closest('[data-act]');
  if(actBtn){
    const card = e.target.closest('.card');
    const id = Number(card.dataset.id);
    const item = data.find(x=>x.id===id);
    const act = actBtn.dataset.act;
    if(act === 'sale-plus'){
      if(remaining(item) > 0){ item.sold = (item.sold||0) + 1; }
    } else if(act === 'sale-minus'){
      item.sold = Math.max(0, (item.sold||0) - 1);
    } else if(act === 'receive-plus'){
      const val = window.prompt('Сколько штук пришло на склад?', '1');
      const n = parseInt(val, 10);
      if(!isNaN(n) && n > 0){ item.received = (item.received||0) + n; }
    }
    renderStats();
    refreshCard(card, item);
    safeSave();
  }
});

document.getElementById('list').addEventListener('input', (e)=>{
  const input = e.target.closest('input[data-key]');
  if(!input) return;
  const card = e.target.closest('.card');
  const id = Number(card.dataset.id);
  const item = data.find(x=>x.id===id);
  const key = input.dataset.key;
  const num = parseFloat(input.value.replace(',', '.'));
  item[key] = isNaN(num) ? 0 : num;
  renderStats();
  refreshCard(card, item);
  safeSave();
});

document.getElementById('search').addEventListener('input', renderList);

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lisyang_tovary.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(Array.isArray(parsed)){ data = parsed; safeSave(); render(); }
    }catch(err){ alert('Не удалось прочитать файл'); }
  };
  reader.readAsText(file);
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(window.confirm('Сбросить все изменения к исходным данным?')){
    data = JSON.parse(JSON.stringify(RAW_DATA));
    safeSave();
    render();
  }
});

document.getElementById('addBtn').addEventListener('click', ()=>{
  const newId = Math.max(0, ...data.map(x=>x.id)) + 1;
  data.push({id:newId, code:'Код '+newId, name:'Новый товар', kaspi:'', variant:'', note:'', price:0, qty:1, costYuan:0, rate:70, weight:0, tariff:1800, deliveryExtra:0, packaging:100, received:0, sold:0});
  openId = newId;
  safeSave();
  render();
});

render();
</script>
</body>
</html>
