name: Capture original Lixiang visual reference
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-lixiang-reference.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture old and new site
        run: node shop/capture-reference.mjs
      - name: Save reference files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shop/reference
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "test(shop): save current visual reference for migration"
          git push origin HEAD:main
