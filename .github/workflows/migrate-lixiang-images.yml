name: Migrate Lixiang product images
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-lixiang-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate publicly hosted product photos
        run: python3 shop/migrate_images.py
      - name: Commit copied assets without altering other project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shop/index.html shop/assets/products
          if git diff --cached --quiet; then
            echo "No product images were accessible; existing storefront unchanged."
          else
            git commit -m "chore(shop): move accessible product images off Lovable"
            git push origin HEAD:main
          fi
