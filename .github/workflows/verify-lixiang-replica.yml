name: Verify original-style replica
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-lixiang-replica.yml', 'shop/test-original-replica.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated static preview
        run: |
          python3 -m http.server 8788 > /tmp/lixiang-server.log 2>&1 &
          sleep 2
      - name: Run all storefront tests and render screenshots
        run: node shop/test-original-replica.mjs
      - name: Save checked reference screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop/reference/replica.jpg shop/reference/replica-mobile.jpg
          git commit -m "test(shop): save verified original-look preview snapshots"
          git push origin HEAD:main
