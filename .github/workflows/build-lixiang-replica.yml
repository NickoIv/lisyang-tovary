name: Build original-style Lixiang replica
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-lixiang-replica.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate self-contained original design using public assets
        run: node shop/build-original-replica.mjs
      - name: Check no Lovable dependencies and assets
        run: |
          test -s shop/replica/index.html
          test -s shop/replica/styles.css
          test -s shop/replica/app.js
          test "$(find shop/replica/assets/products -name '*.jpg' | wc -l)" -ge 16
          if grep -qE 'lovable-badge|__l5e|assets/styles-[A-Za-z0-9_-]+\.css' shop/replica/index.html; then
            echo 'Unexpected old host references'; exit 1
          fi
      - name: Commit replica for preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shop/replica
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "feat(shop): original design replica independent of Lovable"
            git push origin HEAD:main
          fi
